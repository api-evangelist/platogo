description: Platogo Interactive Entertainment GmbH is a Vienna, Austria based social
  casino gaming studio that builds and operates free-to-play slot and casino apps
  for mobile and web. Its flagship titles are Slotpark, a premium Vegas-style social
  slots app used by millions daily, and Gaminator, one of the largest social casino
  gaming communities on the web. The company localizes its games into more than 13
  languages and works alongside industry partners including Greentube and Novomatic.
  Platogo is backed by Seedcamp. No public developer API, SDK, or technical documentation
  is currently published; this profile captures the company identity and domain-security
  posture only.
